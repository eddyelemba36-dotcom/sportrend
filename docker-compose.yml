services:
  postgres:
    image: postgres:16-alpine
    container_name: odds-postgres
    environment:
      POSTGRES_DB: odds_aggregator
      POSTGRES_USER: odds_user
      POSTGRES_PASSWORD: odds_pass
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: odds-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: odds-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: odds_user
      RABBITMQ_DEFAULT_PASS: odds_pass
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  rabbitdata:
